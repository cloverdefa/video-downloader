[package]
name = "video-downloader"
version = "1.7.0"
edition = "2024"
build = "build.rs"

[dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "system_fonts",
    "clipboard",
    "x11",
    "wayland",
] }
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
dirs = "6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
