[package]
name = "video-downloader"
version = "1.17.0"
edition = "2024"
description = "yt-dlp / ffmpeg / Deno GUI 影片下載器"
repository = "https://github.com/cloverdefa/video-downloader"

[dependencies]
# GUI
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "system_fonts",
    "clipboard",
    "x11",
    "wayland",
] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
rfd = "0.15"
png = "0.18.1"

# 設定檔
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 自動更新（update.rs）
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
self-replace = "1"

# Linux 發佈檔為 .tar.gz，自動更新時需要解壓縮
[target.'cfg(unix)'.dependencies]
tar = "0.4"
flate2 = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
