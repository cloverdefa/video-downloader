name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# ====================================================================
# 避免同時執行多個 Release Workflow
# ====================================================================

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  # ==================================================================
  # Job 1: 判斷版本號
  # ==================================================================

  version:
    name: Determine Version

    # ================================================================
    # 僅允許：
    #
    # 1. 手動觸發 workflow_dispatch
    #
    # 2. PR 成功合併
    #    test -> main
    # ================================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'test'
      )

    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_type: ${{ steps.version.outputs.release_type }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}

    steps:

      # ==============================================================
      # Checkout
      #
      # workflow_dispatch:
      #   使用 main
      #
      # pull_request:
      #   使用 PR merge commit
      # ==============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch'
              && 'main'
              || github.event.pull_request.merge_commit_sha
            }}
          fetch-depth: 0

      # ==============================================================
      # Determine version
      # ==============================================================

      - name: Get next version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # ==========================================================
          # Helper: Find latest semantic version tag
          # ==========================================================

          function Get-LatestTag {

            $tags = @(
              git tag --list "v*.*.*" |
                Where-Object {
                  $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$'
                } |
                Sort-Object {
                  $parts = $_.Substring(1).Split('.')

                  [version]::new(
                    [int]$parts[0],
                    [int]$parts[1],
                    [int]$parts[2]
                  )
                }
            )

            if ($tags.Count -eq 0) {
              return $null
            }

            return $tags[-1]
          }


          # ==========================================================
          # Helper: Analyze ONE commit
          #
          # 一個 Commit = 一個分析單位
          #
          # Subject:
          #   git show -s --format='%s'
          #
          # Body:
          #   git show -s --format='%b'
          #
          # BREAKING CHANGE:
          #   僅從 Body 判斷
          # ==========================================================

          function Get-CommitBump(
            [string]$sha
          ) {

            $subject = git show `
              -s `
              --format='%s' `
              $sha

            $body = git show `
              -s `
              --format='%b' `
              $sha

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Commit: $sha"
            Write-Host "Subject: $subject"

            if ($body) {
              Write-Host "Body:"
              Write-Host $body
            }
            else {
              Write-Host "Body: <empty>"
            }

            # --------------------------------------------------------
            # MAJOR
            #
            # Conventional Commit:
            #
            #   feat!:
            #   fix!:
            #   feat(scope)!:
            #   fix(scope)!:
            #
            # 以及：
            #
            #   BREAKING CHANGE:
            #
            # 中文：
            #
            #   重大變更:
            #   破壞性變更:
            # --------------------------------------------------------

            if (
              $subject -match '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' -or
              $body -match '(?m)^BREAKING CHANGE:' -or
              $subject -match '^[^\r\n]*(重大變更|破壞性變更)[:：]' -or
              $body -match '(?m)^[^\r\n]*(重大變更|破壞性變更)[:：]'
            ) {
              Write-Host "Detected bump: MAJOR"
              return "major"
            }


            # --------------------------------------------------------
            # MINOR
            #
            #   feat:
            #   feat(scope):
            #   新增:
            #   功能:
            # --------------------------------------------------------

            if (
              $subject -match '^(feat)(\([^)]*\))?[:：]' -or
              $subject -match '^(新增|功能)[:：]' -or
              $subject -match '^(新增|功能)(\([^)]*\))?[:：]'
            ) {
              Write-Host "Detected bump: MINOR"
              return "minor"
            }


            # --------------------------------------------------------
            # PATCH
            #
            #   fix:
            #   fix(scope):
            #   chore:
            #   chore(scope):
            #   修正:
            #   修復:
            # --------------------------------------------------------

            if (
              $subject -match '^(fix|chore)(\([^)]*\))?[:：]' -or
              $subject -match '^(修正|修復)[:：]' -or
              $subject -match '^(修正|修復)(\([^)]*\))?[:：]'
            ) {
              Write-Host "Detected bump: PATCH"
              return "patch"
            }


            # --------------------------------------------------------
            # NONE
            #
            # docs / refactor / style / test / ci / build / perf
            # 或其他不符合規則的 Commit
            # --------------------------------------------------------

            Write-Host "Detected bump: NONE"

            return "none"
          }


          # ==========================================================
          # Helper: Analyze all commits in range
          #
          # Priority:
          #
          #   major > minor > patch > none
          # ==========================================================

          function Get-ReleaseBump(
            [string]$commitRange
          ) {

            $releaseType = "none"

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Commit range: $commitRange"
            Write-Host "========================================"

            $commits = @(
              git rev-list $commitRange
            )

            if ($commits.Count -eq 0) {
              Write-Host "No commits found."
              return "none"
            }

            foreach ($sha in $commits) {

              if ([string]::IsNullOrWhiteSpace($sha)) {
                continue
              }

              $commitBump = Get-CommitBump $sha

              switch ($commitBump) {

                "major" {

                  $releaseType = "major"

                }

                "minor" {

                  if ($releaseType -ne "major") {
                    $releaseType = "minor"
                  }

                }

                "patch" {

                  if ($releaseType -eq "none") {
                    $releaseType = "patch"
                  }

                }

                "none" {
                  # No version bump
                }

                default {
                  throw "Unknown bump type: $commitBump"
                }
              }

              # ------------------------------------------------------
              # 已經達到最高版本等級
              # 不需要再分析其他 Commit
              # ------------------------------------------------------

              if ($releaseType -eq "major") {

                Write-Host ""
                Write-Host "Highest release level reached: MAJOR"

                break
              }
            }

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Detected release type: $releaseType"
            Write-Host "========================================"

            return $releaseType
          }


          # ==========================================================
          # Helper: Calculate next version
          # ==========================================================

          function Get-NextVersion(
            [string]$latestTag,
            [string]$releaseType
          ) {

            # --------------------------------------------------------
            # No previous release
            #
            # patch -> v0.1.1
            # minor -> v0.2.0
            # major -> v1.0.0
            # --------------------------------------------------------

            if (-not $latestTag) {

              switch ($releaseType) {

                "patch" {
                  return "v0.1.1"
                }

                "minor" {
                  return "v0.2.0"
                }

                "major" {
                  return "v1.0.0"
                }

                default {
                  throw "Invalid release type: $releaseType"
                }
              }
            }


            # --------------------------------------------------------
            # Existing release
            # --------------------------------------------------------

            $parts = $latestTag.Substring(1).Split('.')

            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]

            switch ($releaseType) {

              "patch" {

                $patch++

              }

              "minor" {

                $minor++
                $patch = 0

              }

              "major" {

                $major++
                $minor = 0
                $patch = 0

              }

              default {
                throw "Invalid release type: $releaseType"
              }
            }

            return "v$major.$minor.$patch"
          }


          # ==========================================================
          # Fetch tags
          # ==========================================================

          git fetch --tags --force


          # ==========================================================
          # Determine target commit
          #
          # workflow_dispatch:
          #   main HEAD
          #
          # pull_request:
          #   PR merge commit
          # ==========================================================

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {

            $targetSha = git rev-parse main

            Write-Host "Trigger: workflow_dispatch"
            Write-Host "Target branch: main"

          }
          else {

            $targetSha = "${{ github.event.pull_request.merge_commit_sha }}"

            Write-Host "Trigger: pull_request"
            Write-Host "Source branch: ${{ github.event.pull_request.head.ref }}"
            Write-Host "Target branch: ${{ github.event.pull_request.base.ref }}"
          }

          if ([string]::IsNullOrWhiteSpace($targetSha)) {
            throw "Target commit SHA is empty."
          }

          Write-Host "Target SHA: $targetSha"


          # ==========================================================
          # Find latest release tag
          # ==========================================================

          $latestTag = Get-LatestTag

          if ($latestTag) {
            Write-Host "Latest release tag: $latestTag"
          }
          else {
            Write-Host "Latest release tag: none"
          }


          # ==========================================================
          # Determine release type
          # ==========================================================

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {

            # --------------------------------------------------------
            # Manual release
            #
            # 完全使用使用者選擇的版本類型
            # --------------------------------------------------------

            $releaseType = "${{ inputs.release_type }}"

            Write-Host ""
            Write-Host "Trigger: workflow_dispatch"
            Write-Host "Manual release type: $releaseType"

          }
          else {

            # --------------------------------------------------------
            # Automatic release
            #
            # Analyze commits after latest release.
            # --------------------------------------------------------

            if ($latestTag) {

              $commitRange = "$latestTag..$targetSha"

            }
            else {

              $commitRange = $targetSha

            }

            $releaseType = Get-ReleaseBump $commitRange

            # --------------------------------------------------------
            # No release required
            # --------------------------------------------------------

            if ($releaseType -eq "none") {

              Write-Host ""
              Write-Host "No release required."

              "should_release=false" |
                Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Append `
                  -Encoding utf8

              exit 0
            }
          }


          # ==========================================================
          # Calculate next version
          # ==========================================================

          $tag = Get-NextVersion `
            $latestTag `
            $releaseType

          $version = $tag.Substring(1)


          # ==========================================================
          # Validate generated version
          # ==========================================================

          if (
            $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$'
          ) {
            throw "Invalid generated tag: $tag"
          }


          # ==========================================================
          # Prevent duplicate local tag
          # ==========================================================

          $localTag = git tag --list $tag

          if ($localTag) {
            throw "Tag $tag already exists locally."
          }


          # ==========================================================
          # Prevent duplicate remote tag
          # ==========================================================

          $remoteTag = git ls-remote `
            --tags `
            origin `
            "refs/tags/$tag"

          if ($remoteTag) {
            throw "Tag $tag already exists on origin."
          }


          # ==========================================================
          # Final information
          # ==========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Release summary"
          Write-Host "========================================"
          Write-Host "Release type : $releaseType"
          Write-Host "Version      : $version"
          Write-Host "Tag          : $tag"
          Write-Host "Target SHA   : $targetSha"
          Write-Host "========================================"


          # ==========================================================
          # GitHub Actions outputs
          # ==========================================================

          @(
            "should_release=true"
            "release_type=$releaseType"
            "version=$version"
            "tag=$tag"
            "target_sha=$targetSha"
          ) |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8


  # ==================================================================
  # Job 2: 建置執行檔
  # ==================================================================

  build:
    name: Build Executable

    needs:
      - version

    if: needs.version.outputs.should_release == 'true'

    runs-on: windows-latest

    steps:

      # ==============================================================
      # Checkout exact target commit
      #
      # 不再 checkout main
      #
      # 這裡必須與 version Job 使用同一個 target_sha。
      # ==============================================================

      - name: Checkout target commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.target_sha }}
          fetch-depth: 0


      # ==============================================================
      # Setup Python
      # ==============================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"


      # ==============================================================
      # Install dependencies
      # ==============================================================

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller


      # ==============================================================
      # Install yt-dlp
      # ==============================================================

      - name: Install yt-dlp
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\bin"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $bin |
            Out-Null

          $url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$bin\yt-dlp.exe"

          Add-Content `
            $env:GITHUB_PATH `
            $bin

          Write-Host "yt-dlp version:"
          & "$bin\yt-dlp.exe" --version


      # ==============================================================
      # Install FFmpeg
      # ==============================================================

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\bin"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $extract = "$env:RUNNER_TEMP\ffmpeg"

          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $ffmpeg = Get-ChildItem `
            -Path $extract `
            -Filter "ffmpeg.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "ffmpeg.exe not found"
          }

          Copy-Item `
            $ffmpeg.FullName `
            "$bin\ffmpeg.exe" `
            -Force

          Write-Host "FFmpeg version:"
          & "$bin\ffmpeg.exe" -version |
            Select-Object -First 1


      # ==============================================================
      # Install Deno
      # ==============================================================

      - name: Install Deno
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\bin"
          $zip = "$env:RUNNER_TEMP\deno.zip"
          $extract = "$env:RUNNER_TEMP\deno"

          $url = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          if (-not (Test-Path "$extract\deno.exe")) {
            throw "deno.exe not found"
          }

          Copy-Item `
            "$extract\deno.exe" `
            "$bin\deno.exe" `
            -Force

          Write-Host "Deno version:"
          & "$bin\deno.exe" --version


      # ==============================================================
      # Verify dependencies
      # ==============================================================

      - name: Verify dependencies
        shell: pwsh
        run: |

          Write-Host "=============================="
          Write-Host "yt-dlp"
          Write-Host "=============================="

          yt-dlp --version


          Write-Host ""
          Write-Host "=============================="
          Write-Host "FFmpeg"
          Write-Host "=============================="

          ffmpeg -version |
            Select-Object -First 1


          Write-Host ""
          Write-Host "=============================="
          Write-Host "Deno"
          Write-Host "=============================="

          deno --version


      # ==============================================================
      # Build executable
      # ==============================================================

      - name: Build executable
        shell: pwsh
        run: |

          $env:APP_VERSION = "${{ needs.version.outputs.version }}"

          Write-Host "Application version: $env:APP_VERSION"

          pyinstaller `
            --clean `
            video_downloader.spec


      # ==============================================================
      # Verify executable
      # ==============================================================

      - name: Verify executable
        shell: pwsh
        run: |

          $exe = "dist\video_downloader.exe"

          if (-not (Test-Path $exe)) {
            throw "Build failed: $exe not found"
          }

          $size = (Get-Item $exe).Length / 1MB

          Write-Host "Build succeeded."
          Write-Host "Executable: $exe"
          Write-Host ("Size: {0:N2} MB" -f $size)


      # ==============================================================
      # Upload executable artifact
      # ==============================================================

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_downloader
          path: dist/video_downloader.exe
          retention-days: 1


  # ==================================================================
  # Job 3: 建立 GitHub Release
  # ==================================================================

  release:
    name: Create Release

    needs:
      - version
      - build

    if: needs.version.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # Download executable artifact
      # ==============================================================

      - name: Download executable artifact
        uses: actions/download-artifact@v8
        with:
          name: video_downloader
          path: dist


      # ==============================================================
      # Create GitHub Release
      #
      # 使用與 Build 完全相同的 target_sha。
      # 不使用 mutable main。
      # ==============================================================

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.target_sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/video_downloader.exe
